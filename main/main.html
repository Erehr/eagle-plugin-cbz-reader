<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create CBZ</title>
    <link rel="stylesheet" href="main.css">
    <script src="main.js" defer></script>
</head>

<body>
    <div class="app">
        <!-- Custom titlebar (draggable) -->
        <div class="titlebar">
            <span class="titlebar-text" id="titlebar-text">Create CBZ</span>
            <button class="titlebar-close" id="btn-close" title="Close">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>

        <div class="image-list" id="image-list">
            <div class="empty-state" id="empty-state">
                <p>Select images in Eagle, then open this plugin.</p>
            </div>
        </div>

        <footer class="footer">
            <div class="footer-left">
                <div class="name-field" id="name-field">
                    <input type="text" id="cbz-name" placeholder="archive" spellcheck="false" autocomplete="off"
                        aria-label="Archive file name">
                    <span class="name-suffix" id="cbz-suffix">.cbz</span>
                    <!-- Off-screen twin of the input, used only to measure text width -->
                    <span class="name-mirror" id="cbz-mirror" aria-hidden="true"></span>
                </div>
                <div class="toggle-group">
                    <input type="checkbox" id="chk-trash-originals">
                    <label for="chk-trash-originals" title="After the CBZ is created and added to your library, the selected originals are moved to Eagle's Trash.">Move
                        originals to Trash</label>
                </div>
            </div>
            <span class="status" id="status"></span>
            <button id="btn-create" disabled>Create CBZ</button>
        </footer>
    </div>
</body>

</html>
